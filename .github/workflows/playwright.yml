name: Distributed Playwright CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'metrics/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'metrics/**'

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://demowebshop.tricentis.com
  FAKER_SEED: 12345

jobs:
  quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests on shard
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-json/results-${{ matrix.shardIndex }}.json
        run: >
          npx playwright test
          --project=chromium
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload blob report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 14
      - name: Upload JSON test report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: json-report-${{ matrix.shardIndex }}
          path: playwright-json/
          retention-days: 14

  merge-reports:
    name: Merge Reports & Publish Metrics
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: ${{ always() && needs.quality.result == 'success' && needs.test.result != 'cancelled' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Download all shard blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Download all shard JSON reports
        uses: actions/download-artifact@v4
        with:
          path: playwright-json
          pattern: json-report-*
          merge-multiple: true
      - name: Aggregate test outcomes and write job summary
        id: build-summary
        run: npm run report:summary
        env:
          PLAYWRIGHT_JSON_DIR: playwright-json
          METRICS_DIR: metrics
          CI_REPORT_DIR: ci-report
      - name: Upload machine-readable test summary
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-metrics
          path: |
            ci-report/
            metrics/latest.json
          retention-days: 30
      - name: Merge blob reports into unified HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload unified HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Publish latest metrics to main
        if: ${{ always() && steps.build-summary.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/latest.json metrics/history.json metrics/pass-rate.json metrics/final-success.json metrics/failed.json metrics/flaky.json metrics/total-scenarios.json
          if git diff --cached --quiet; then
            echo "Metrics did not change."
          else
            git commit -m "chore(metrics): publish Playwright run results [skip ci]"
            git push origin HEAD:main
          fi
      - name: Create or update GitHub bugs
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result != 'cancelled' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          PLAYWRIGHT_JSON_DIR: playwright-json
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BUG_TRACKER_PROJECT_OWNER: vilayatalimirza
          BUG_TRACKER_PROJECT_NUMBER: '1'
          BUG_TRACKER_PROJECT_TITLE: Bug Tracker
          BUG_TRACKER_STATUS: To triage
        run: npm run report:issues
      - name: Show workflow run information
        if: ${{ always() }}
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Test job result: ${{ needs.test.result }}"
